<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

<title>The Book of Chalk</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap');

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #080706;
}

body {
    font-family: "IM Fell English", serif;
    color: #c9c7bb;
}

/* =========================
   BOOK VIEW
========================= */

.book-view {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #080706;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    z-index: 200;
    overflow: hidden;
}

.book-view.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

/* =========================
   BOOK SCROLL CONTAINER
========================= */

.book-scroll {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    scrollbar-width: none;
}

.book-scroll::-webkit-scrollbar {
    display: none;
}

/* =========================
   BOOK
========================= */

.book {
    position: relative;
    width: 92vw;
    max-width: 1400px;
    aspect-ratio: 3 / 2;
    flex-shrink: 0;

    background-image: url("book-page.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    transform: perspective(1200px) rotateX(1deg) scale(.98);

    box-shadow:
        0 30px 80px rgba(0,0,0,.8),
        0 10px 30px rgba(0,0,0,.6);

    overflow: hidden;
}

.book-view.active .book {
    transform: perspective(1200px) rotateX(1deg) scale(1);
}

/* =========================
   PAGES
========================= */

.page {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 50%;
    padding: 7% 10%;
}

.page.left {
    left: 0;
    cursor: pointer;
    padding-left: 15%;
}

.page.right {
    right: 0;
    cursor: pointer;
}

/* =========================
   PAGE CONTENT
========================= */

.page-content {
    position: relative;
    width: 100%;
    height: 100%;
}

.book-header {
    font-size: clamp(18px, 2vw, 28px);
    letter-spacing: .08em;
    margin-bottom: 10px;
    color: #c9c7bb;
}

.fragment {
    font-size: 9px;
    letter-spacing: .16em;
    margin-bottom: 28px;
    opacity: .8;
}

.manuscript {
    width: 82%;
    font-size: clamp(14px, 1.35vw, 19px);
    line-height: 1.55;
    color: #c7c5b9;
}

.manuscript p {
    margin: 0 0 18px;
}

/* =========================
   RIGHT TEXT
========================= */

.right-text {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding-bottom: 5%;
}

.right-text p {
    width: 82%;
    font-size: clamp(14px, 1.35vw, 19px);
    line-height: 1.55;
    color: #c7c5b9;
    margin: 0;
}

.time-clue {
    margin-top: 28px;
    font-size: 9px;
    letter-spacing: .3em;
    opacity: .8;
}

/* =========================
   FRAGMENT I
========================= */

.fragment-one-left .page-content {
    transform: translateY(4cm);
}

/* =========================
   FRAGMENT II
========================= */

.fragment-two-left .page-content {
    transform: translateY(4cm);
}

.fragment-two-left .book-header {
    font-size: clamp(15px, 1.5vw, 21px);
}

.fragment-two-left .fragment {
    font-size: 8px;
    margin-bottom: 26px;
}

.fragment-two-left .manuscript {
    font-size: clamp(12px, 1.1vw, 16px);
}

/* =========================
   FRAGMENT II IMAGE
========================= */

.fragment-two-image {
    padding: 8% 5%;
    transform: translateX(-70px);
}

.fragment-two-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

/* =========================
   PAGE NUMBERS
========================= */

.page-number {
    position: absolute;
    bottom: 6%;
    font-size: 8px;
    opacity: .55;
}

.page.left .page-number {
    left: 10%;
}

.page.right .page-number {
    right: 10%;
}

/* =========================
   CLOSE BUTTON
========================= */

.close-book {
    position: fixed;
    top: 20px;
    right: 20px;

    width: 40px;
    height: 40px;

    border: 1px solid rgba(201,199,187,.25);
    background: rgba(0,0,0,.4);
    color: #c9c7bb;

    font-family: serif;
    font-size: 24px;

    cursor: pointer;
    z-index: 500;
}

/* =========================
   MODAL
========================= */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    opacity: 0;
    visibility: hidden;
    pointer-events: none;

    z-index: 1000;
}

.modal.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

.modal-content {
    width: min(600px, 90vw);
    padding: 40px;

    background: #11100d;
    border: 1px solid rgba(201,199,187,.2);

    box-shadow: 0 30px 80px rgba(0,0,0,.8);
}

.modal h2 {
    margin-top: 0;
    color: #c9c7bb;
}

.modal p {
    color: #aaa79b;
    line-height: 1.7;
}

/* =========================================================
   PORTRAIT MOBILE
   DO NOT CHANGE
========================================================= */

@media (max-width:700px) {

    .book-view {
        padding: 0;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .book {
        width: 96vw;
        max-width: 96vw;
        height: auto;
        aspect-ratio: 3 / 2;
        max-height: none;
        flex-shrink: 0;

        transform:
            perspective(1200px)
            rotateX(1deg)
            scale(.98);
    }

    .book-view.active .book {
        transform:
            perspective(1200px)
            rotateX(1deg)
            scale(1);
    }

    .page {
        padding: 7% 6%;
    }

    .page.left {
        padding-left: 12%;
    }

    .book-header {
        font-size: 10px;
        letter-spacing: .08em;
        margin-bottom: 5px;
    }

    .fragment {
        font-size: 5px;
        letter-spacing: .13em;
        margin-bottom: 13px;
    }

    .manuscript {
        width: 78%;
        max-width: 78%;
        font-size: 7px;
        line-height: 1.45;
        overflow-wrap: break-word;
        word-break: normal;
    }

    .right-text {
        padding-bottom: 0;
        justify-content: center;
    }

    .right-text p {
        width: 78%;
        max-width: 78%;
        font-size: 7px;
        line-height: 1.5;
        overflow-wrap: break-word;
        word-break: normal;
    }

    .time-clue {
        margin-top: 16px;
        font-size: 5px;
        letter-spacing: .25em;
    }

    .fragment-one-left .page-content {
        transform: translateY(1.1cm);
    }

    .fragment-two-left .page-content {
        transform: translateY(1.1cm);
    }

    .fragment-two-left .book-header {
        font-size: 10px;
    }

    .fragment-two-left .fragment {
        font-size: 5px;
        margin-bottom: 12px;
    }

    .fragment-two-left .manuscript {
        width: 78%;
        max-width: 78%;
        font-size: 7px;
        line-height: 1.4;
    }

    .fragment-two-image {
        padding: 8% 5%;
        transform: translateX(-42px);
    }

    .fragment-two-image img {
        width: 100%;
        height: 100%;
    }

    .page-number {
        bottom: 5%;
        font-size: 6px;
    }

    .page.left .page-number {
        left: 7%;
    }

    .page.right .page-number {
        right: 7%;
    }

    .close-book {
        top: 10px;
        right: 10px;
        width: 32px;
        height: 32px;
        font-size: 20px;
    }

    .modal {
        padding: 15px;
    }

    .modal-content {
        width: 90vw;
        padding: 30px 22px;
    }

    .modal h2 {
        font-size: 22px;
    }

    .modal p {
        font-size: 14px;
        line-height: 1.6;
    }
}

/* =========================================================
   EXTRA SMALL MOBILE
   DO NOT CHANGE
========================================================= */

@media (max-width:380px) {

    .book {
        width: 94vw;
        max-width: 94vw;
    }

    .page {
        padding: 6% 5%;
    }

    .page.left {
        padding-left: 11%;
    }

    .fragment-one-left .page-content,
    .fragment-two-left .page-content {
        transform: translateY(1cm);
    }

    .book-header,
    .fragment-two-left .book-header {
        font-size: 9px;
    }

    .fragment,
    .fragment-two-left .fragment {
        font-size: 4px;
        margin-bottom: 10px;
    }

    .manuscript,
    .fragment-two-left .manuscript,
    .right-text p {
        width: 76%;
        max-width: 76%;
        font-size: 6px;
        line-height: 1.35;
    }

    .time-clue {
        margin-top: 14px;
        font-size: 4px;
    }

    .fragment-two-image {
        transform: translateX(-36px);
    }
}

/* =========================================================
   LANDSCAPE MOBILE
   ONLY THIS SECTION WAS CHANGED
========================================================= */

@media (max-width:700px) and (orientation:landscape) {

    .book-view {
        display: flex;
        width: 100%;
        height: 100dvh;

        padding: 0;
        margin: 0;

        align-items: center;
        justify-content: center;

        overflow: hidden;

        touch-action: pinch-zoom;
    }

    .book-scroll {
        width: 100%;
        height: 100%;

        display: flex;
        align-items: center;
        justify-content: center;

        overflow: visible;

        padding: 0;
        margin: 0;

        touch-action: pinch-zoom;
    }

    /*
       IMPORTANT:
       The book is sized from BOTH screen width and height.

       This guarantees the complete 3:2 spread
       fits inside the landscape screen.
    */

    .book {
        width: min(
            92vw,
            calc((100dvh - 24px) * 1.5)
        );

        height: auto;

        aspect-ratio: 3 / 2;

        max-width: 92vw;
        max-height: calc(100dvh - 24px);

        margin: 0;

        flex-shrink: 0;

        /*
           No perspective / rotation here.
           This prevents the top and bottom edges
           from being pushed outside the viewport.
        */

        transform: none !important;
    }

    .book-view.active .book {
        transform: none !important;
    }
}
</style>
</head>

<body>

<!-- =========================
     BOOK
========================= -->

<div class="book-view" id="bookView">

    <button class="close-book" id="closeBook">×</button>

    <div class="book-scroll" id="bookScroll">

        <div class="book" id="book">

            <!-- LEFT PAGE -->

            <section class="page left fragment-one-left" id="leftPage">

                <div class="page-content">

                    <div class="book-header">
                        THE BOOK OF CHALK
                    </div>

                    <div class="fragment">
                        FRAGMENT I
                    </div>

                    <div class="manuscript">
                        <p>
                            This record was never meant to be found.
                        </p>

                        <p>
                            If you have found this book,
                            do not assume you were meant to.
                        </p>

                        <p>
                            The pages do not reveal what happened.
                        </p>

                        <p>
                            They reveal what remembers you.
                        </p>
                    </div>

                </div>

                <div class="page-number">I</div>

            </section>


            <!-- RIGHT PAGE -->

            <section class="page right" id="rightPage">

                <div class="page-content right-text">

                    <p>
                        Some pages were written
                        before they happened.
                    </p>

                    <div class="time-clue">
                        13:13
                    </div>

                </div>

                <div class="page-number">II</div>

            </section>

        </div>

    </div>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const bookView = document.getElementById("bookView");
const bookScroll = document.getElementById("bookScroll");
const closeBookButton = document.getElementById("closeBook");


/* =========================
   OPEN BOOK
========================= */

function openBook() {
    bookView.classList.add("active");

    if (bookScroll) {
        bookScroll.scrollTop = 0;
        bookScroll.scrollLeft = 0;
    }
}


/* =========================
   CLOSE BOOK
========================= */

function closeBook() {
    bookView.classList.remove("active");

    if (bookScroll) {
        bookScroll.scrollTop = 0;
        bookScroll.scrollLeft = 0;
    }
}


closeBookButton.addEventListener("click", closeBook);


/* =========================
   ESC KEY
========================= */

document.addEventListener("keydown", function(e) {

    if (e.key === "Escape") {
        closeBook();
    }

});


/* =========================
   TEMPORARY DEMO OPEN
   REMOVE ONLY IF YOU ALREADY
   HAVE YOUR OWN OPEN FUNCTION
========================= */

/*
   The actual site can call:

       openBook();

   whenever the Book of Chalk should open.
*/

</script>

</body>
</html>
```
